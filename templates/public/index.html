<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <meta name="shopify-api-key" content="__SHOPIFY_API_KEY__" />
    <script src="https://cdn.shopify.com/shopifycloud/polaris-1.js"></script>
    <script src="https://cdn.shopify.com/shopifycloud/app-bridge.js"></script>

    <title>App</title>
  </head>

  <body>
    <s-app-nav>
      <s-link href="/">Start</s-link>
      <s-link href="/learn">Learn</s-link>
    </s-app-nav>

    <meow-app error-heading="Something went wrong">
      <meow-route route-path="/" page-tag="meow-index"></meow-route>
      <meow-route route-path="/learn" page-tag="meow-guide"></meow-route>
      <meow-route route-path="/learn/:topicName" page-tag="meow-topic"></meow-route>
    </meow-app>

    <script type="module" src="/meowapps/meow-app.js"></script>
    <script type="module" src="/components/meow-note.js"></script>
    <script type="module" src="/pages/meow-index.js"></script>
    <script type="module" src="/pages/meow-guide.js"></script>
    <script type="module" src="/pages/meow-topic.js"></script>
  </body>
</html>
